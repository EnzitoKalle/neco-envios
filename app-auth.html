<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Volver a NecoEnvíos</title></head>
<body style="font-family:system-ui,sans-serif;text-align:center;padding:32px 20px;background:#f6faf8;color:#0f172a">
<h2 id="t">✅ Listo</h2>
<p id="m">Volvé a la app de NecoEnvíos.</p>
<a id="b" href="#" style="display:block;max-width:360px;margin:18px auto;background:#0b6e5a;color:#fff;font-weight:800;padding:18px;border-radius:16px;text-decoration:none;font-size:18px">ABRIR NECOENVÍOS</a>
<p style="font-size:12px;color:#64748b">Si no se abre sola, tocá el botón verde.</p>
<script>
  // Esta página solo sirve para volver a la app Android después de ingresar con Google.
  var h = location.hash || '', q = location.search || '';
  if (!h && !q) { document.getElementById('t').textContent = 'No llegó la sesión'; document.getElementById('m').textContent = 'Volvé a la app e intentá ingresar de nuevo.'; document.getElementById('b').style.display = 'none'; }
  else {
    var dest = 'com.necoenvios.repartidor://auth' + (h || q);
    document.getElementById('b').href = dest;
    setTimeout(function () { location.href = dest; }, 300);
  }
</script></body></html>
